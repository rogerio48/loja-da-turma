<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loja da Turma</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/calculos.js" defer></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <main>
    <p class="etiqueta">NOSSO PRIMEIRO CI/CD</p>
    <h1>Loja da Turma</h1>
    <p>Uma pequena loja. Uma grande descoberta sobre automacao.</p>
    <section aria-labelledby="produto">
      <h2 id="produto">Caderno Criativo</h2>
      <p class="preco">R$ 15,00</p>
      <label for="quantidade">Quantidade de cadernos</label>
      <input id="quantidade" type="number" min="1" max="99" value="1">
      <button id="calcular" type="button">Calcular compra</button>
      <p id="resultado" role="status">Escolha a quantidade e clique no botao.</p>
    </section>
    <p id="ambiente">Consultando o servidor...</p>
    <footer>Minha turma aprendeu CI/CD</footer>
  </main>
</body>
</html>
